name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :android:assembleDebug --no-daemon --stacktrace

      - name: Upload TinyCraft debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TinyCraft-debug-APK
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Run core tests
        continue-on-error: true
        run: gradle :core:test --no-daemon --stacktrace
