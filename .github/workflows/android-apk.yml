name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run core tests
        id: core_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :core:test --no-daemon --console=plain --stacktrace 2>&1 | tee core-test.log

      - name: Build debug APK
        id: build_apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :android:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee android-build.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TinyCraft-ci-logs
          path: |
            core-test.log
            android-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload TinyCraft debug APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TinyCraft-debug-APK
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Enforce build gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.core_tests.outcome }}" = "success"
          test "${{ steps.build_apk.outcome }}" = "success"
