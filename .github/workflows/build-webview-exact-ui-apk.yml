name: Build exact-UI WebView APK

on:
  workflow_dispatch:
  push:
    branches:
      - webview-apk-exact-ui
    paths:
      - "webview-android/**"
      - ".github/workflows/build-webview-exact-ui-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle Three.js locally
        run: |
          mkdir -p webview-android/app/src/main/assets/www/vendor
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js \
            --output webview-android/app/src/main/assets/www/vendor/three.module.js
          test -s webview-android/app/src/main/assets/www/vendor/three.module.js

      - name: Build debug APK
        run: gradle -p webview-android :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TinyCraft-exact-ui-debug-apk
          path: webview-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
