name: Build TinyCraft Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-android-exact-ui
    paths:
      - "native-android/**"
      - ".github/workflows/build-native-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build native debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains no web runtime assets
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          if unzip -l "$APK" | grep -E '\.(html|css|js)$|three\.module|WebView|libgdx|badlogic' ; then
            echo "Unexpected web/libGDX runtime content found in native APK"
            exit 1
          fi

      - name: Boot emulator and verify rendered screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd native-android
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.tinycraft.nativeandroid/.MainActivity
            sleep 6
            adb exec-out screencap -p > ../tinycraft-screen.png
            adb logcat -d > ../tinycraft-logcat.txt
            if grep -E "FATAL EXCEPTION|OpenGL shader compile failed|program link failed" ../tinycraft-logcat.txt ; then
              echo "Renderer/runtime failure found in logcat"
              exit 1
            fi
            python3 -m pip install --quiet pillow
            python3 - <<'PY'
            from PIL import Image, ImageStat
            image = Image.open('../tinycraft-screen.png').convert('RGB')
            mean = sum(ImageStat.Stat(image).mean) / 3.0
            print(f'Mean screen brightness: {mean:.2f}')
            if mean < 25:
                raise SystemExit('Visual smoke test failed: screen is effectively black')
            PY

      - name: Upload APK and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TinyCraft-native-android-apk
          path: |
            native-android/app/build/outputs/apk/debug/app-debug.apk
            tinycraft-screen.png
            tinycraft-logcat.txt
          if-no-files-found: error
