name: Build TinyCraft Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-android-exact-ui
    paths:
      - "native-android/**"
      - "ci/tinycraft-debug.keystore.b64"
      - ".github/workflows/build-native-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install stable test signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode "$GITHUB_WORKSPACE/ci/tinycraft-debug.keystore.b64" > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"

      - name: Build native debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains no web runtime assets
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ! unzip -l "$APK" | grep -E '\.(html|css|js)$|three\.module|WebView|libgdx|badlogic'

      - name: Upload APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: TinyCraft-0.2.5-fullscreen-crashfix-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Boot Android 16 emulator and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r "$GITHUB_WORKSPACE/native-android/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am start -W -n com.tinycraft.nativeandroid.fullscreen/com.tinycraft.nativeandroid.MainActivity
            sleep 6
            adb shell pidof com.tinycraft.nativeandroid.fullscreen
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/tinycraft-screen.png"
            adb logcat -d > "$GITHUB_WORKSPACE/tinycraft-logcat.txt"
            ! grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL" "$GITHUB_WORKSPACE/tinycraft-logcat.txt"
            python3 -m pip install --quiet pillow
            python3 -c "import os; from PIL import Image,ImageStat; p=os.path.join(os.environ['GITHUB_WORKSPACE'],'tinycraft-screen.png'); im=Image.open(p).convert('RGB'); mean=sum(ImageStat.Stat(im).mean)/3.0; print('Mean screen brightness: %.2f' % mean); assert mean >= 25, 'Visual smoke test failed: screen is effectively black'"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TinyCraft-0.2.5-fullscreen-crashfix-evidence
          path: |
            tinycraft-screen.png
            tinycraft-logcat.txt
          if-no-files-found: ignore
